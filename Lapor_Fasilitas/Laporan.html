<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Lapor Fasilitas Kampus</h1>
        <p>Formulir Pelaporan Kerusakan</p>
    </header>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="laporan.html">Buat Laporan</a>
        <a href="daftar.html">Daftar Laporan</a>
        <a href="tentang.html">Tentang</a>
    </nav>

    <main>

        <h2>Buat Laporan Kerusakan</h2>

        <form>

            <label for="nama">Nama Pelapor:</label>
            <br>
            <input type="text" id="nama" name="nama">
            <br><br>

            <label for="fasilitas">Nama Fasilitas:</label>
            <br>
            <input type="text" id="fasilitas" name="fasilitas">
            <br><br>

            <label for="lokasi">Lokasi:</label>
            <br>
            <input type="text" id="lokasi" name="lokasi">
            <br><br>

            <label for="deskripsi">Deskripsi Kerusakan:</label>
            <br>
            <textarea id="deskripsi" name="deskripsi"></textarea>
            <br><br>

            <label for="foto">Foto Kerusakan:</label>
            <br>
            <input type="file" id="foto" name="foto">
            <br><br>

            <label for="prioritas">Prioritas:</label>
            <br>

            <select id="prioritas" name="prioritas">
                <option value="rendah">Rendah</option>
                <option value="sedang">Sedang</option>
                <option value="tinggi">Tinggi</option>
            </select>

            <br><br>

            <button type="submit">Kirim Laporan</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Lapor Fasilitas Kampus</p>
    </footer>

</body>
</html>
