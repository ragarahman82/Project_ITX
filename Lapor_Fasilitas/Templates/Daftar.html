<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
</head>
<body>

    <h1>Daftar Akun</h1>

    <form method="POST" action="/register">
        <label>Nama</label>
        <input type="text">

        <br><br>

        <label>Email</label>
        <input type="email">

        <br><br>

        <label>Password</label>
        <input type="password">

        <br><br>

        <button type="submit">Daftar</button>
    </form>

</body>
</html>
